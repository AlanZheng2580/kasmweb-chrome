name: Build and Push to DockerHub

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build tag
        id: tag
        run: |
          KASM_VERSION=$(grep '^FROM kasmweb/chrome:' Dockerfile | cut -d: -f2)
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "value=${KASM_VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/kasmweb-chrome
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag commit
        run: |
          git tag "${{ steps.tag.outputs.value }}"
          git push origin "${{ steps.tag.outputs.value }}"
